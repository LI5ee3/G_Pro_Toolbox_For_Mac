name: macOS Build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: 'Explicitly build development DMG/ZIP (ad-hoc signing; never installs)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # No fork PR execution on self-hosted machines. No signing secrets in this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, toolbox-macos27]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true
      - name: Validate, test and build isolated development artifacts
        run: |
          set -euo pipefail
          python3 macos/scripts/runtime_assets.py prepare
          python3 macos/scripts/runtime_assets.py check
          python3 -m unittest discover -s macos/scripts/tests -v
          swift test --package-path macos --scratch-path "$RUNNER_TEMP/swift-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 macos/scripts/validate_architecture.py
          python3 macos/scripts/validate_preview_boundary.py
          xcodebuild -project macos/Toolbox.xcodeproj -scheme ToolboxApp -configuration Debug -derivedDataPath "$RUNNER_TEMP/app-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY=- build
          xcodebuild -project macos/Toolbox.xcodeproj -scheme ToolboxPreviews -configuration Debug -derivedDataPath "$RUNNER_TEMP/preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY=- build
          python3 macos/scripts/validate_preview_boundary.py "$RUNNER_TEMP/preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/Build/Products/Debug/ToolboxPreviewHost.app"
          ./macos/build_app.sh --mode development --output "$RUNNER_TEMP/toolbox-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --derived-data "$RUNNER_TEMP/app-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --build "$GITHUB_RUN_NUMBER"
  package:
    needs: build
    # Only an explicit opt-in may create DMG/ZIP; push, PR and default manual runs cannot.
    if: github.event_name == 'workflow_dispatch' && inputs.package
    runs-on: [self-hosted, macOS, ARM64, toolbox-macos27]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true
      - name: Explicitly build development packages without installing
        run: |
          set -euo pipefail
          python3 macos/scripts/runtime_assets.py prepare
          ./macos/build_app.sh --mode development --output "$RUNNER_TEMP/package-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --derived-data "$RUNNER_TEMP/package-derived-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --build "$GITHUB_RUN_NUMBER"
          ./macos/make_dmg.sh --mode development --app "$RUNNER_TEMP/package-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/红米G Pro ToolBox.app" --output "$RUNNER_TEMP/toolbox-packages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mimonitor-development-arm64
          path: |
            ${{ runner.temp }}/toolbox-packages-${{ github.run_id }}-${{ github.run_attempt }}/*.dmg
            ${{ runner.temp }}/toolbox-packages-${{ github.run_id }}-${{ github.run_attempt }}/*.zip
            ${{ runner.temp }}/toolbox-packages-${{ github.run_id }}-${{ github.run_attempt }}/release-manifest.json
            ${{ runner.temp }}/toolbox-packages-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
